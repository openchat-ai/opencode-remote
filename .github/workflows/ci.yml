name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript + checkJs)
        run: npm run typecheck

      - name: Lint (syntax + module resolution)
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          # Use a clean state dir for tests
          HOME: ${{ runner.workspace }}/home
          USERPROFILE: ${{ runner.workspace }}/home

      - name: Run check-refs (undeclared variable scan)
        run: npm run check-refs